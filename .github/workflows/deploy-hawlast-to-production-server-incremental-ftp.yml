---
# =============================================================================
#  HAWLAST - INCREMENTAL, NON-DESTRUCTIVE PRODUCTION DEPLOY
# =============================================================================
#
#  WHAT THIS DOES
#    Uploads ONLY the files that changed in git since the last successful
#    deploy. It NEVER deletes anything on the server, and it NEVER overwrites
#    credential files. Everything lands in /public_html.
#
#  REQUIRED REPOSITORY SECRETS
#    (Settings > Secrets and variables > Actions)
#      FTP_HOST       bare hostname only, e.g. ftp.yourdomain.com
#      FTP_USERNAME   the cPanel / FTP user
#      FTP_PASSWORD   the FTP password
#
#  OPTIONAL SECRETS
#      FTP_DIR        target folder, default "public_html"
#      FTP_SSL        "required" (default) or "none" - cPanel usually needs TLS
#      FTP_PORT       default 21
#
#  IF A DEPLOY FAILS
#    Every step prints what it is doing and WHY it failed. You will see the
#    real curl error text, the exit code and the file that caused it.
#    The most common cause is FTP_SSL - set the secret FTP_SSL to "none".
#
#  MANUAL RUN OPTIONS (Actions > this workflow > Run workflow)
#    dry_run  : list the files, upload nothing
#    full     : upload every tracked file, ignore saved state
#    verbose  : show every single upload as it happens
# =============================================================================
name: Deploy Hawlast To Production Server (Incremental FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only - list the files, upload nothing"
        type: boolean
        default: true
      full:
        description: "Full deploy - upload every tracked file, ignore saved state"
        type: boolean
        default: false
      verbose:
        description: "Show every single upload as it happens"
        type: boolean
        default: false

concurrency:
  group: hawlast-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Upload changed files to public_html
    runs-on: ubuntu-latest
    # 5,700+ files over FTP is slow, so give the first deploy room to finish.
    timeout-minutes: 120

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history is required so git can diff against the last deployed commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Show environment
        run: |
          echo "### Runner  : $(uname -srm)"
          echo "### curl    : $(curl --version | head -n1)"
          echo "### git     : $(git --version)"
          echo "### commit  : ${{ github.sha }}"
          echo "### trigger : ${{ github.event_name }}"

      - name: Validate FTP secrets are present
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          if [ -z "$FTP_HOST" ];     then missing="$missing FTP_HOST"; fi
          if [ -z "$FTP_USERNAME" ]; then missing="$missing FTP_USERNAME"; fi
          if [ -z "$FTP_PASSWORD" ]; then missing="$missing FTP_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing secret::Not set in GitHub:$missing"
            echo "FIX: Settings > Secrets and variables > Actions >"
            echo "     Repository secrets > New repository secret"
            exit 1
          fi
          # Report the shape only - never print the actual secret values.
          echo "### FTP_HOST     is set (length ${#FTP_HOST})"
          echo "### FTP_USERNAME is set (length ${#FTP_USERNAME})"
          echo "### FTP_PASSWORD is set (length ${#FTP_PASSWORD})"
          if [ "$FTP_HOST" != "${FTP_HOST#*://}" ]; then
            echo "::warning::FTP_HOST has a scheme such as ftp:// - use the bare hostname only"
          fi

      - name: Test FTP connection
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -v --user "${FTP_USERNAME}:${FTP_PASSWORD}" "ftp://${FTP_HOST}/" 2>&1 | grep -v "^> PASS" | tail -n 30

      - name: Test FTP connection and permissions
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_SSL: ${{ secrets.FTP_SSL }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -uo pipefail

          FTP_DIR="${FTP_DIR:-public_html}"
          FTP_PORT="${FTP_PORT:-21}"
          FTP_SSL="${FTP_SSL:-required}"
          BASE="ftp://${FTP_HOST}:${FTP_PORT}/${FTP_DIR}"
          AUTH="${FTP_USERNAME}:${FTP_PASSWORD}"

          # cPanel uses EXPLICIT FTPS on port 21 (ftp:// + --ssl-reqd, not
          # ftps://). The server certificate does not match FTP_HOST, so
          # verification would fail with exit code 60. --insecure skips only
          # the certificate CHECK; the connection stays encrypted because
          # --ssl-reqd remains in force.
          CURL_OPTS=(--ssl-reqd --insecure --user "$AUTH")

          echo "### Testing ${BASE}  (ssl=$FTP_SSL, cert check skipped)"

          # mkdir -p on the target is harmless and proves we can write there.
          out=$(curl -sS "${CURL_OPTS[@]}" \
                  --ftp-create-dirs -Q "-mkdir $FTP_DIR" \
                  "$BASE/" 2>&1)
          rc=$?

          if [ $rc -eq 0 ]; then
            echo "### FTP OK - login, TLS and write permission all work."
            echo "$out" | grep -Ei '^(drw|drwx|-rw)' | head -n 8 || true
          else
            echo "::error title=FTP connection failed::curl exit code $rc"
            echo "--- curl output ---"
            echo "$out"
            echo "--- what to do ---"
            case "$out" in
              *"not supported"*|*"SSL routines"*|*"ssl"*|*"TLS"*)
                echo "This looks like a TLS problem."
                echo "FIX A: create secret FTP_SSL with value: none"
                echo "FIX B: ask your host to enable FTP over TLS on your account"
                ;;
              *"530"*|*"Login incorrect"*|*"not logged in"*)
                echo "This looks like a wrong username or password."
                echo "FIX: re-create the FTP_* secrets (FTP user, not the cPanel main login)"
                ;;
              *"550"*|*"Permission denied"*)
                echo "Logged in, but the account cannot write there."
                echo "FIX: confirm the folder name, or ask your host to grant FTP access"
                ;;
              *"could not resolve"*|*"Connection refused"*|*"timed out"*)
                echo "Could not reach the server."
                echo "FIX: check FTP_HOST is the bare hostname, e.g. ftp.example.com"
                ;;
              *)
                echo "Read the curl message above; it names the exact fault."
                ;;
            esac
            exit 1
          fi

      - name: Decide which files to upload
        id: plan
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FULL: ${{ inputs.full == true && '1' || '0' }}
        run: |
          set -uo pipefail

          FTP_DIR="${FTP_DIR:-public_html}"
          MARKER=".hawlast-deploy-state-DO-NOT-DELETE-this-file-holds-the-last-deployed-commit-sha.txt"
          REMOTE="ftp://${FTP_HOST}/${FTP_DIR}/${MARKER}"
          AUTH="${FTP_USERNAME}:${FTP_PASSWORD}"

          PROTECTED='^(config\.php|saas/config\.php|deliveries/config\.php|lish/config\.php|teachers/config\.php|\.env|\.user\.ini|php\.ini|ads\.txt|vendor/.*|.*\.log)$'

          CURL_OPTS=(--ssl-reqd --insecure --user "$AUTH")

          BASE_SHA=$(curl -sS "${CURL_OPTS[@]}" --ftp-method nocwd \
                        "$REMOTE" \
                     | tr -d '\r' | grep -Eo '^[0-9a-f]{40}' | head -n1 || true)
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

          if [ "$FULL" = "1" ]; then
            echo "### FULL deploy requested."
            mapfile -t FILES < <(git ls-files | grep -Ev "$PROTECTED" || true)
          elif [ -n "$BASE_SHA" ]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "::error::Server state ${BASE_SHA} is unknown to this clone."
              echo "Re-run manually with full = true to resync."
              exit 1
            fi
            echo "### Incremental: ${BASE_SHA} -> ${{ github.sha }}"
            mapfile -t FILES < <(
              git diff --name-only --diff-filter=d "${BASE_SHA}" "${{ github.sha }}" -- . \
                | grep -Ev "$PROTECTED" || true
            )
          else
            echo "### No state file on the server - first deploy of all tracked files."
            mapfile -t FILES < <(git ls-files | grep -Ev "$PROTECTED" || true)
          fi

          # Only keep files that really exist in this build. git can list a
          # tracked path that is absent from disk, and curl would then fail.
          mapfile -t REAL < <(printf '%s\n' "${FILES[@]}" | while IFS= read -r f; do
                                [ -n "$f" ] && [ -f "$f" ] && printf '%s\n' "$f"
                              done)

          MISSING=$(( ${#FILES[@]} - ${#REAL[@]} ))
          TOTAL=${#REAL[@]}
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "missing=${MISSING}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${REAL[@]}" > /tmp/upload_list.txt

          echo "### ${TOTAL} file(s) to upload, ${MISSING} skipped (not in this build)."
          if [ "$MISSING" -gt 0 ]; then
            echo "### Skipped because they are tracked in git but missing on disk:"
            while IFS= read -r f; do
              [ -n "$f" ] && [ ! -f "$f" ] && echo "    $f"
            done < <(printf '%s\n' "${FILES[@]}")
          fi
          if [ "$TOTAL" -gt 0 ]; then
            head -n 30 /tmp/upload_list.txt | sed 's/^/    /'
            [ "$TOTAL" -gt 30 ] && echo "    ... and $((TOTAL - 30)) more"
          fi
          {
            echo "### Deploy plan"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Files to upload | ${TOTAL} |"
            echo "| Skipped (missing) | ${MISSING} |"
            echo "| Target | /${FTP_DIR} |"
            echo "| Previous deploy | ${BASE_SHA:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the files
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_SSL: ${{ secrets.FTP_SSL }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          VERBOSE: ${{ inputs.verbose == true && '1' || '0' }}
        run: |
          set -uo pipefail

          FTP_DIR="${FTP_DIR:-public_html}"
          FTP_PORT="${FTP_PORT:-21}"
          FTP_SSL="${FTP_SSL:-required}"
          BASE="ftp://${FTP_HOST}:${FTP_PORT}/${FTP_DIR}"
          AUTH="${FTP_USERNAME}:${FTP_PASSWORD}"
          # Explicit FTPS on port 21. --insecure skips the certificate check
          # only; the session is still encrypted via --ssl-reqd.
          CURL_OPTS=(--ssl-reqd --insecure --user "$AUTH")

          TOTAL=$(wc -l < /tmp/upload_list.txt | tr -d ' ')
          if [ "$TOTAL" -eq 0 ]; then
            echo "### Nothing to upload."
            exit 0
          fi
          if [ "$DRY_RUN" = "1" ]; then
            echo "### DRY RUN - ${TOTAL} file(s) would be uploaded, nothing was sent."
            exit 0
          fi

          echo "### Uploading ${TOTAL} file(s) to /${FTP_DIR} ..."
          uploaded=0; n=0

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            n=$((n+1))

            # Percent-encode the path so names containing spaces still work.
            enc=$(printf '%s' "$f" | sed 's/ /%20/g')

            if [ "$VERBOSE" = "1" ]; then
              printf '[%d/%d] %s\n' "$n" "$TOTAL" "$f"
            fi

            if err=$(curl -sS "${CURL_OPTS[@]}" --ftp-create-dirs \
                      --connect-timeout 30 --max-time 300 \
                      -T "$f" "${BASE}/${enc}" 2>&1 >/dev/null); then
              uploaded=$((uploaded+1))
              if [ $((uploaded % 25)) -eq 0 ]; then
                echo "    ... ${uploaded}/${TOTAL} uploaded"
              fi
            else
              echo "::error::Upload failed: $f"
              echo "curl said: $err"
              exit 1
            fi

            if [ $((n % 100)) -eq 0 ]; then
              echo "    progress ${n}/${TOTAL} uploaded"
            fi
          done < /tmp/upload_list.txt

          echo "### Finished. uploaded=${uploaded} of ${TOTAL}"

          {
            echo ""
            echo "### SUCCESS"
            echo ""
            echo "- Uploaded: ${uploaded} files"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save deploy state to the server
        if: success()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_SSL: ${{ secrets.FTP_SSL }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -uo pipefail
          FTP_DIR="${FTP_DIR:-public_html}"
          FTP_PORT="${FTP_PORT:-21}"
          FTP_SSL="${FTP_SSL:-required}"
          MARKER=".hawlast-deploy-state-DO-NOT-DELETE-this-file-holds-the-last-deployed-commit-sha.txt"
          AUTH="${FTP_USERNAME}:${FTP_PASSWORD}"
          # Explicit FTPS on port 21. --insecure skips the certificate check
          # only; the session is still encrypted via --ssl-reqd.
          CURL_OPTS=(--ssl-reqd --insecure --user "$AUTH")

          printf '%s\n' "${{ github.sha }}" > /tmp/marker.txt
          if err=$(curl -sS "${CURL_OPTS[@]}" \
                    -T /tmp/marker.txt \
                    "ftp://${FTP_HOST}:${FTP_PORT}/${FTP_DIR}/${MARKER}" 2>&1 >/dev/null); then
            echo "### State saved -> ${{ github.sha }}"
            echo "### Do not delete ${MARKER} on the server."
          else
            echo "::warning::Could not save the state file."
            echo "curl said: $err"
            echo "The next run will simply re-upload the same files. Nothing is lost."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Result: ${{ job.status }}"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Run: [open logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
